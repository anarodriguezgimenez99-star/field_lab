name: macOS CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run tests
        run: swift test

      - name: Build Apple silicon unsigned DMG
        run: scripts/package-macos-dmg.sh
        env:
          FIELD_BUILD_NUMBER: ${{ github.run_number }}

      - name: Upload DMG artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: field-lab-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: field-lab-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256
          --verify-tag
          --generate-notes
          --title "FIELD LAB $GITHUB_REF_NAME"
